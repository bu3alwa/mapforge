<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapforge</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23d9a441'/><path d='M6 24l7-14 5 8 3-4 5 10z' fill='%2316140f'/></svg>" />
    <script type="module" crossorigin src="./assets/index-DKfh62OD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BHgbdcSN.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="logo"></span>Mapforge</div>
        <input id="mapName" class="map-name" spellcheck="false" aria-label="Map name" />
        <div class="actions">
          <button id="btnNew" title="New map">New</button>
          <button id="btnOpen" title="Open a saved map (.json)">Open</button>
          <button id="btnSave" title="Save map file (Ctrl+S)">Save</button>
          <span class="sep"></span>
          <button id="btnUndo" class="icon" title="Undo (Ctrl+Z)">↶</button>
          <button id="btnRedo" class="icon" title="Redo (Ctrl+Y)">↷</button>
          <button id="btnGrid" class="toggle on" title="Toggle grid (Shift+G)">Grid</button>
          <button id="btnSnap" class="toggle on" title="Snap objects to the grid (N). Hold Shift to do the opposite for one placement.">Snap</button>
          <select id="gridType" class="top-select" title="Grid type">
            <option value="square">Squares</option>
            <option value="hex-pointy">Hex (rows)</option>
            <option value="hex-flat">Hex (columns)</option>
          </select>
          <select id="hexSize" class="top-select" title="Hex size (across the flat sides)" hidden>
            <option value="1">5 ft hex</option>
            <option value="2">10 ft hex</option>
            <option value="3">15 ft hex</option>
            <option value="6">30 ft hex</option>
          </select>
          <button id="btnHexTerrain" class="toggle on" title="Draw the terrain as whole hexes (off: squares under the hex grid)" hidden>Hex terrain</button>
          <button id="btnFit" title="Fit map to screen (F)">Fit</button>
          <span class="sep"></span>
          <button id="btnExport" class="primary" title="Export as image">Export PNG</button>
        </div>
      </header>

      <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>

      <main class="stage" id="stage">
        <canvas id="view"></canvas>
        <div class="status" id="status"></div>
        <div class="toast" id="toast"></div>
      </main>

      <aside class="panel">
        <div class="tabs" role="tablist">
          <button data-tab="draw" class="active" role="tab">Draw</button>
          <button data-tab="generate" role="tab">Generate</button>
        </div>
        <div class="tab-body" id="tab-draw">
          <section id="toolOptions"></section>
          <section id="selectionPanel" hidden></section>
          <section>
            <h3>Terrain</h3>
            <div class="swatches" id="terrainPalette"></div>
          </section>
          <section>
            <h3>Objects</h3>
            <div id="objectPalette"></div>
          </section>
        </div>
        <div class="tab-body" id="tab-generate" hidden>
          <section>
            <h3>Generator</h3>
            <div class="gen-list" id="genList"></div>
          </section>
          <section>
            <div id="genDesc" class="hint"></div>
            <div id="genParams" class="form"></div>
            <label class="field">
              <span>Seed</span>
              <div class="row">
                <input id="genSeed" spellcheck="false" />
                <button id="genDice" class="icon" title="New random seed">🎲</button>
              </div>
            </label>
            <div class="target" id="genTarget"></div>
            <div class="row gap">
              <button id="genRun" class="primary grow">Generate</button>
              <button id="genReroll" title="New seed and generate">Re-roll</button>
            </div>
            <p class="hint">Tip: use the <b>Area</b> tool to pick part of the map, then generate into just that area. Mix a city beside a forest, or caves under a lava field.</p>
          </section>
        </div>
      </aside>
    </div>

    <dialog id="dlgNew">
      <form method="dialog" class="form">
        <h2>New map</h2>
        <label class="field"><span>Name</span><input id="newName" value="Untitled map" /></label>
        <label class="field"><span>Size</span>
          <select id="newPreset">
            <option value="30x22">Battle map (30 × 22)</option>
            <option value="60x45" selected>Dungeon (60 × 45)</option>
            <option value="100x75">Large (100 × 75)</option>
            <option value="160x120">Region / city (160 × 120)</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <div class="row gap" id="newCustom">
          <label class="field grow"><span>Width</span><input id="newW" type="number" min="8" max="400" value="60" /></label>
          <label class="field grow"><span>Height</span><input id="newH" type="number" min="8" max="400" value="45" /></label>
        </div>
        <label class="field"><span>Start with</span>
          <select id="newFill">
            <option value="0">Solid rock (for dungeons)</option>
            <option value="5">Grass</option>
            <option value="2">Water</option>
            <option value="7">Forest floor</option>
          </select>
        </label>
        <p class="hint">Each square is 5 ft. The current map is replaced (save it first if you need it).</p>
        <div class="row gap end">
          <button value="cancel">Cancel</button>
          <button id="newCreate" value="ok" class="primary">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlgExport">
      <form method="dialog" class="form">
        <h2>Export PNG</h2>
        <label class="field"><span>Pixels per square</span>
          <select id="expPx">
            <option value="50">50 px (small)</option>
            <option value="70" selected>70 px (Roll20)</option>
            <option value="100">100 px (Foundry VTT)</option>
            <option value="140">140 px (print / high detail)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="expGrid" checked /> Draw grid</label>
        <label class="check"><input type="checkbox" id="expArea" /> Only the selected area</label>
        <p class="hint" id="expInfo"></p>
        <div class="row gap end">
          <button value="cancel">Cancel</button>
          <button id="expGo" value="ok" class="primary">Export</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="fileInput" accept=".json,application/json" hidden />
  </body>
</html>
